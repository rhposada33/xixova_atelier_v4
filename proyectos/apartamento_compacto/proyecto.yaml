schema: 1
id: apartamento_compacto
arquitectura: arquitectura.yaml
variantes:
  natural_lila: natural_lila.yaml
presentacion: presentacion.yaml
guion_camara: guion_camara.yaml
produccion:
  catalogo: catalogo.yaml
  blender: ~/Aplicaciones/blender-4.5/blender
  salidas: ../../resultados/framework
  fps: 24
  gpu_vram_gb: 6
  ram_gb: 16
  licencias_permitidas:
  - propia
  - CC0
  - CC Attribution
  perfiles:
    previa:
      resolucion:
      - 640
      - 360
      muestras: 12
      motor: CYCLES
      denoise: true
    animatica:
      resolucion:
      - 480
      - 270
      muestras: 1
      motor: BLENDER_WORKBENCH
      denoise: false
      crf: 20
      preset: medium
    final:
      resolucion:
      - 746
      - 420
      muestras: 32
      motor: CYCLES
      denoise: true
      crf: 18
      preset: slow
